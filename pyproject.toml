[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manupulator2"
version = "0.1.0"
description = "6-DOF robotic arm manipulator with active forearm vision, finger-pointing object search, and Zenoh-based thin/thick client architecture"
readme = "README.md"
authors = [
    { name = "Alex", email = "sasha.sidenko09@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.15.0",
    "sympy>=1.13.0",
    "ikpy>=4.1.0",
    "mujoco>=3.15.0",
    "opencv-python>=5.0.0.0",
    "mediapipe>=1.0.0",
    "ultralytics>=8.4.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "eclipse-zenoh>=1.10.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
